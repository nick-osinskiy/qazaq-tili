name: Validate Vue app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm run test
      - name: Check types and build
        run: npm run build
      - name: Save private preview build
        uses: actions/upload-artifact@v4
        with:
          name: soz-site-preview
          path: dist/
          retention-days: 7
